name: Deploy auf GitHub Pages

on:
  push:
    branches: ["main", "claude/great-noether-bhev0p"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Erst prüfen, dann bauen: schlägt Typprüfung oder ein Test fehl,
      # bricht der Job ab und es wird nichts veröffentlicht.
      - name: Typprüfung
        run: npm run lint
      - name: Tests
        run: npm test
      - run: npm run build
        env:
          # Supabase-Zugang (öffentlich-sicher; Schutz über Row Level Security).
          # In den Repo-Einstellungen unter Settings → Secrets and variables →
          # Actions als Repository-Secrets hinterlegen.
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
